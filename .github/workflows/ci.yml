name: CI — Backend Build & Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Cài .NET 10 SDK
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Restore tất cả packages (api + tests, bỏ qua mobile vì cần Android SDK)
      - name: Restore dependencies
        run: |
          dotnet restore api/Api.csproj
          dotnet restore tests/Api.Tests/Api.Tests.csproj

      # Build API (Release) — phát hiện compile error sớm
      - name: Build API
        run: dotnet build api/Api.csproj --no-restore -c Release --verbosity minimal

      # Chạy unit tests với coverlet (code coverage)
      - name: Run tests
        run: |
          dotnet test tests/Api.Tests/Api.Tests.csproj \
            --no-restore \
            --verbosity minimal \
            --logger "trx;LogFileName=test-results.trx" \
            --collect:"XPlat Code Coverage"

      # Upload test results để xem trong GitHub Actions UI
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/*.trx"
          retention-days: 7
